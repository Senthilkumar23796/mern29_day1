<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="max-w-[100%] mx-auto">
        <div class="w-[90%] mx-auto flex flex-col gap-3 h-screen justify-center items-center">
            <p id="countValue">0</p>
            <div class="flex gap-5">
                <button id="btnIncrement" class="bg-green-500 rounded-lg px-5 py-3 text-white">Increment</button>
                <button id="btnDecrement" class="bg-red-500 rounded-lg px-5 py-3 text-white">Decrement</button>
                <button id="btnReset" class="bg-yellow-400 rounded-lg px-5 py-3 text-white">Reset</button>
            </div>
        </div>
    </div>
</body>
<script>
    let countValue = document.getElementById("countValue");
    let incrementBtn = document.getElementById("btnIncrement");
    let decrementBtn = document.getElementById("btnDecrement");
    let btnReset = document.getElementById("btnReset");
    incrementBtn.addEventListener("click", ()=>{
        countValue.innerText = parseInt(countValue.innerText) + 1;
    })
    decrementBtn.addEventListener("click", ()=>{
        countValue.innerText = parseInt(countValue.innerText) - 1;
    })
    btnReset.addEventListener("click", ()=>{
        countValue.innerText = 0;
    })
</script>
</html>
