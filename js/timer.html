<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="max-w-[100%] mx-auto">
        <div class="w-[90%] mx-auto flex flex-col gap-3 h-screen justify-center items-center">
            <p id="countValue">0</p>
            <div class="flex gap-5">
                <button id="btnStart" class="bg-green-500 rounded-lg px-5 py-3 text-white">Start</button>
                <button id="btnStop" class="bg-red-500 rounded-lg px-5 py-3 text-white">Stop</button>
                <button id="btnReset" class="bg-yellow-400 rounded-lg px-5 py-3 text-white">Reset</button>
            </div>
        </div>
    </div>
    
</body>
<script>
    let countValue = document.getElementById("countValue")
    let btnStart = document.getElementById("btnStart")
    let btnStop = document.getElementById("btnStop")
    let resetBtn = document.getElementById("btnReset")

    let interval;

    btnStart.addEventListener("click", ()=>{
        interval = setInterval(()=>{
            countValue.innerText = parseInt(countValue.innerText) + 1
        },1000)
    })

    btnStop.addEventListener("click", ()=>{
        clearInterval(interval)
    })

    resetBtn.addEventListener("click", ()=>{
        clearInterval(interval);
        countValue.innerText = 0
    })
</script>
</html>
